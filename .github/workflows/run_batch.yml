name: Process Archive Part

on:
  workflow_dispatch:
    inputs:
      target_filename:
        description: 'Full filename to process (e.g., xpolite-emaildb.part-2-.part005.rar)'
        required: true
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          pip install huggingface_hub duckdb

      - name: Run Processing Script
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEST_REPO: ${{ secrets.DEST_REPO }}
        # Pass the input directly into the script prompt
        run: |
          echo "${{ inputs.target_filename }}" | python process_script.py
